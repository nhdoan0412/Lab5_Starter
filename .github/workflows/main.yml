name: Unit Tests

on: [push]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Sum Test
        run: npm test ./__tests__/sum.test.js

      - name: Unit Test
        run: npm test ./__tests__/unit.test.js